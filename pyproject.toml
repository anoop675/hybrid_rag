[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-scifact"
version = "0.1.0"
description = "Hybrid BM25 + fine-tuned ColBERT re-ranking + RAG generation on SciFact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.22.0",
    "datasets>=2.14.0",
    "ir_measures>=0.4.3",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "tqdm>=4.60.0",
    "bitsandbytes>=0.42.0",
    "accelerate>=0.27.0",
    "sympy==1.12",
    "torch",
]

[tool.setuptools.packages.find]
include = ["hybrid_rag*"]
